allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: true

overrides:
  postcss: '8.5.10'
  # Prisma 6.19.3 aún solicita la rama vulnerable; forzamos la versión corregida.
  deepmerge-ts: '8.0.0'
